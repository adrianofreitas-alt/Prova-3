<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Avaliação Dinâmica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: 0 auto;
        }
        h2, h3 { text-align: center; color: #444; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        .secondary-btn { background-color: #28a745; }
        .secondary-btn:hover { background-color: #218838; }
        .hidden { display: none; }
        .questao { background: #f9f9f9; padding: 15px; margin-bottom: 15px; border-left: 4px solid #007bff; border-radius: 4px; }
        .opcoes label { font-weight: normal; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="container">
    <div id="tela-inicial">
        <h2>Sistema de Provas</h2>
        <button onclick="acessarPainelProfessor()">Painel do Professor</button>
        <button class="secondary-btn" onclick="acessarPainelAluno()">Realizar Prova (Aluno)</button>
    </div>

    <div id="painel-professor" class="hidden">
        <h2>Configuração da Avaliação</h2>
        <div class="form-group">
            <label>Nome do Professor:</label>
            <input type="text" id="prof-nome">
        </div>
        <div class="form-group">
            <label>Escola:</label>
            <input type="text" id="prof-escola">
        </div>
        <div class="form-group">
            <label>Assunto da Avaliação:</label>
            <input type="text" id="prof-assunto">
        </div>
        <div class="form-group">
            <label>Conteúdo da Prova (Cole o texto base aqui):</label>
            <textarea id="prof-conteudo" rows="5"></textarea>
        </div>
        <div class="form-group">
            <label>Quantidade de Perguntas:</label>
            <input type="number" id="prof-qtd-perguntas" min="1" value="1">
        </div>
        <div class="form-group">
            <label>Tipo de Prova:</label>
            <select id="prof-tipo-prova">
                <option value="objetiva">Objetiva (A, B, C, D, E)</option>
                <option value="descritiva">Descritiva (Dissertativa)</option>
            </select>
        </div>
        <button onclick="salvarConfiguracao()">Salvar e Criar Prova</button>
        <button style="background-color: #6c757d;" onclick="voltarInicio()">Voltar</button>
    </div>

    <div id="tela-prova" class="hidden">
        <h2 id="prova-titulo-escola">Escola</h2>
        <h3 id="prova-titulo-assunto">Assunto</h3>
        <p><strong>Professor(a):</strong> <span id="prova-txt-prof"></span></p>
        <hr>
        <div id="prova-texto-base" style="background: #eee; padding: 10px; border-radius:4px; margin-bottom:15px; font-style: italic;"></div>
        
        <form id="formulario-prova">
            <div id="container-perguntas"></div>
            <button type="button" class="secondary-btn" onclick="corrigirProva()">Enviar Respostas</button>
        </form>
    </div>

    <div id="tela-resultado" class="hidden">
        <h2>Resultado da Avaliação</h2>
        <div id="resultado-conteudo"></div>
        <button onclick="voltarInicio()">Voltar ao Início</button>
    </div>
</div>

<script>
    // Banco de dados simulado no localStorage para persistir os dados no navegador
    let dadosProva = JSON.parse(localStorage.getItem('dadosProva')) || null;

    function voltarInicio() {
        document.getElementById('tela-inicial').classList.remove('hidden');
        document.getElementById('painel-professor').classList.add('hidden');
        document.getElementById('tela-prova').classList.add('hidden');
        document.getElementById('tela-resultado').classList.add('hidden');
    }

    function acessarPainelProfessor() {
        const senha = prompt("Digite a senha do professor:");
        if (senha === "ahf") {
            document.getElementById('tela-inicial').classList.add('hidden');
            document.getElementById('painel-professor').classList.remove('hidden');
        } else {
            alert("Senha incorreta!");
        }
    }

    function salvarConfiguracao() {
        const nome = document.getElementById('prof-nome').value;
        const escola = document.getElementById('prof-escola').value;
        const assunto = document.getElementById('prof-assunto').value;
        const conteudo = document.getElementById('prof-conteudo').value;
        const qtd = parseInt(document.getElementById('prof-qtd-perguntas').value);
        const tipo = document.getElementById('prof-tipo-prova').value;

        if(!nome || !escola || !assunto || !conteudo || !qtd) {
            alert("Por favor, preencha todos os campos!");
            return;
        }

        // Como o sistema gera as perguntas dinamicamente com base no texto colado,
        // criamos uma simulação de perguntas numeradas.
        dadosProva = { nome, escola, assunto, conteudo, qtd, tipo };
        localStorage.setItem('dadosProva', JSON.stringify(dadosProva));

        alert("Prova configurada com sucesso!");
        voltarInicio();
    }

    function acessarPainelAluno() {
        dadosProva = JSON.parse(localStorage.getItem('dadosProva'));
        if (!dadosProva) {
            alert("Nenhuma prova foi configurada pelo professor ainda!");
            return;
        }

        document.getElementById('tela-inicial').classList.add('hidden');
        document.getElementById('tela-prova').classList.remove('hidden');

        // Preenche o cabeçalho da prova
        document.getElementById('prova-titulo-escola').innerText = dadosProva.escola;
        document.getElementById('prova-titulo-assunto').innerText = "Avaliação de " + dadosProva.assunto;
        document.getElementById('prova-txt-prof').innerText = dadosProva.nome;
        document.getElementById('prova-texto-base').innerText = "Texto de apoio/Conteúdo:\n" + dadosProva.conteudo;

        // Gera as perguntas
        const container = document.getElementById('container-perguntas');
        container.innerHTML = ""; // Limpa perguntas anteriores

        for (let i = 1; i <= dadosProva.qtd; i++) {
            const div = document.createElement('div');
            div.className = "questao";
            
            if (dadosProva.tipo === "objetiva") {
                div.innerHTML = `
                    <p><strong>Questão ${i}:</strong> Com base no texto de apoio, assinale a alternativa correta:</p>
                    <div class="opcoes">
                        <label><input type="radio" name="q${i}" value="A"> a) Opção A alternativa baseada no conteúdo.</label><br>
                        <label><input type="radio" name="q${i}" value="B"> b) Opção B alternativa baseada no conteúdo.</label><br>
                        <label><input type="radio" name="q${i}" value="C"> c) Opção C alternativa baseada no conteúdo (Correta simulada).</label><br>
                        <label><input type="radio" name="q${i}" value="D"> d) Opção D alternativa baseada no conteúdo.</label><br>
                        <label><input type="radio" name="q${i}" value="E"> e) Opção E alternativa baseada no conteúdo.</label>
                    </div>
                `;
            } else {
                div.innerHTML = `
                    <p><strong>Questão ${i}:</strong> Discorra e explique os pontos principais do texto de apoio referentes ao tema.</p>
                    <textarea name="q${i}" rows="3" placeholder="Digite sua resposta aqui..."></textarea>
                `;
            }
            container.appendChild(div);
        }
    }

    function corrigirProva() {
        const form = document.getElementById('formulario-prova');
        const resultadoDiv = document.getElementById('resultado-conteudo');
        let nota = 0;

        if (dadosProva.tipo === "objetiva") {
            let respondidas = 0;
            // Simulação de gabarito: Para fins de demonstração programática, 
            // a alternativa 'C' será considerada a correta para todas.
            for (let i = 1; i <= dadosProva.qtd; i++) {
                const resposta = form.elements[`q${i}`].value;
                if(resposta) {
                    respondidas++;
                    if(resposta === "C") {
                        nota += (10 / dadosProva.qtd);
                    }
                }
            }

            if(respondidas < dadosProva.qtd) {
                if(!confirm("Você deixou questões em branco. Deseja enviar mesmo assim?")) return;
            }

            resultadoDiv.innerHTML = `
                <p><strong>Tipo de avaliação:</strong> Objetiva</p>
                <p>Sua nota final foi: <strong>${nota.toFixed(1)} / 10.0</strong></p>
                <small>*Nota calculada automaticamente baseada no gabarito padrão (C).</small>
            `;

        } else {
            // Provas descritivas necessitam de análise textual. 
            // Aqui simulamos uma correção verificando se o aluno não deixou em branco 
            // e se usou palavras contidas no texto do professor.
            let preenchidas = 0;
            let palavrasChaveAcertos = 0;
            const palavrasTextoBase = dadosProva.conteudo.toLowerCase().split(/\s+/);

            for (let i = 1; i <= dadosProva.qtd; i++) {
                const respostaTexto = form.elements[`q${i}`].value.trim().toLowerCase();
                if(respostaTexto.length > 5) {
                    preenchidas++;
                    // Verifica se o aluno citou termos do texto base
                    palavrasTextoBase.forEach(palavra => {
                        if(palavra.length > 3 && respostaTexto.includes(palavra)) {
                            palavrasChaveAcertos++;
                        }
                    });
                }
            }

            // Cálculo simulado para dissertativa
            if(preenchidas === 0) nota = 0;
            else {
                nota = (preenchidas / dadosProva.qtd) * 7; // Garante até 7 pontos por responder
                if(palavrasChaveAcertos > 5) nota += 3; // Bônus de coerência com o texto base
                if(nota > 10) nota = 10;
            }

            resultadoDiv.innerHTML = `
                <p><strong>Tipo de avaliação:</strong> Descritiva</p>
                <p>Sua nota estimada (IA/Sistema): <strong>${nota.toFixed(1)} / 10.0</strong></p>
                <p><em>Nota baseada na completude da resposta e associação de termos com o arquivo/texto fornecido pelo professor.</em></p>
            `;
        }

        // Transiciona para a tela de resultados
        document.getElementById('tela-prova').classList.add('hidden');
        document.getElementById('tela-resultado').classList.remove('hidden');
    }
</script>

</body>
</html>
