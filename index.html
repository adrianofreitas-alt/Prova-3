<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Avaliação Inteligente</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #eef2f3;
            color: #333;
        }
        .container {
            max-width: 650px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            margin: 20px auto;
        }
        h2, h3 { text-align: center; color: #2c3e50; margin-top: 0; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #34495e; }
        input[type="text"], input[type="number"], select, input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="file"] { background: #f8f9fa; cursor: pointer; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }
        .btn-aluno { background-color: #2ecc71; }
        .btn-aluno:hover { background-color: #27ae60; }
        .btn-voltar { background-color: #95a5a6; }
        .btn-voltar:hover { background-color: #7f8c8d; }
        .hidden { display: none; }
        .questao { background: #f8f9fa; padding: 20px; margin-bottom: 20px; border-left: 5px solid #3498db; border-radius: 6px; }
        .opcoes label { font-weight: normal; display: block; margin: 8px 0; cursor: pointer; }
        textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; resize: vertical; box-sizing: border-box; }
        .cabecalho-prova { border-bottom: 2px solid #3498db; padding-bottom: 15px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="tela-inicial">
        <h2>Painel de Avaliações</h2>
        <button onclick="acessarPainelProfessor()">Sou Professor</button>
        <button class="btn-aluno" onclick="solicitarNomeAluno()">Sou Aluno</button>
    </div>

    <div id="tela-identificacao-aluno" class="hidden">
        <h2>Identificação do Aluno</h2>
        <div class="form-group">
            <label>Digite seu Nome Completo:</label>
            <input type="text" id="aluno-nome" placeholder="Ex: João Silva">
        </div>
        <button class="btn-aluno" onclick="iniciarProvaAluno()">Iniciar a Prova</button>
        <button class="btn-voltar" onclick="voltarInicio()">Voltar</button>
    </div>

    <div id="painel-professor" class="hidden">
        <h2>Configuração da Prova</h2>
        <div class="form-group">
            <label>Nome do Professor:</label>
            <input type="text" id="prof-nome">
        </div>
        <div class="form-group">
            <label>Escola / Instituição:</label>
            <input type="text" id="prof-escola">
        </div>
        <div class="form-group">
            <label>Assunto da Avaliação:</label>
            <input type="text" id="prof-assunto">
        </div>
        <div class="form-group">
            <label>Selecione o Arquivo de Perguntas (.txt):</label>
            <input type="file" id="prof-arquivo" accept=".txt,.csv">
            <small style="color: #7f8c8d;">O arquivo deve conter uma pergunta por linha.</small>
        </div>
        <div class="form-group">
            <label>Quantidade de Perguntas a Extrair:</label>
            <input type="number" id="prof-qtd-perguntas" min="1" value="5">
        </div>
        <div class="form-group">
            <label>Tipo de Questões:</label>
            <select id="prof-tipo-prova">
                <option value="objetiva">Objetiva (Múltipla Escolha A a E)</option>
                <option value="descritiva">Descritiva (Dissertativa)</option>
            </select>
        </div>
        <button onclick="processarESalvarProva()">Salvar e Publicar Prova</button>
        <button class="btn-voltar" onclick="voltarInicio()">Voltar</button>
    </div>

    <div id="tela-prova" class="hidden">
        <div class="cabecalho-prova">
            <h2 id="topo-escola">Nome da Escola</h2>
            <h3 id="topo-assunto">Assunto da Prova</h3>
            <p><strong>Professor(a):</strong> <span id="topo-prof"></span></p>
            <p><strong>Aluno(a):</strong> <span id="topo-aluno"></span></p>
        </div>
        
        <form id="formulario-prova">
            <div id="container-perguntas"></div>
            <button type="button" class="btn-aluno" onclick="finalizarECorrigir()">Concluir e Enviar Prova</button>
        </form>
    </div>

    <div id="tela-resultado" class="hidden">
        <h2>Avaliação Finalizada</h2>
        <div id="resultado-conteudo" style="font-size: 16px; line-height: 1.6; background: #f9f9f9; padding: 20px; border-radius: 8px;"></div>
        <button class="btn-voltar" onclick="voltarInicio()">Voltar ao Menu Inicial</button>
    </div>
</div>

<script>
    // Armazenamento das perguntas extraídas do arquivo
    let perguntasExtraidas = [];

    function voltarInicio() {
        document.getElementById('tela-inicial').classList.remove('hidden');
        document.getElementById('painel-professor').classList.add('hidden');
        document.getElementById('tela-identificacao-aluno').classList.add('hidden');
        document.getElementById('tela-prova').classList.add('hidden');
        document.getElementById('tela-resultado').classList.add('hidden');
    }

    function acessarPainelProfessor() {
        const senha = prompt("Digite a senha de acesso do Professor:");
        if (senha === "ahf") {
            document.getElementById('tela-inicial').classList.add('hidden');
            document.getElementById('painel-professor').classList.remove('hidden');
        } else {
            alert("Senha incorreta! Acesso negado.");
        }
    }

    function processarESalvarProva() {
        const nome = document.getElementById('prof-nome').value;
        const escola = document.getElementById('prof-escola').value;
        const assunto = document.getElementById('prof-assunto').value;
        const qtd = parseInt(document.getElementById('prof-qtd-perguntas').value);
        const tipo = document.getElementById('prof-tipo-prova').value;
        const arquivoInput = document.getElementById('prof-arquivo');

        if (!nome || !escola || !assunto || !qtd || arquivoInput.files.length === 0) {
            alert("Por favor, preencha todos os campos e selecione o arquivo de perguntas.");
            return;
        }

        const arquivo = arquivoInput.files[0];
        const leitor = new FileReader();

        leitor.onload = function(e) {
            const texto = e.target.result;
            // Divide o arquivo por quebras de linha e remove linhas vazias
            const linhas = texto.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);

            if (linhas.length === 0) {
                alert("O arquivo selecionado está vazio!");
                return;
            }

            // Seleciona as perguntas baseado na quantidade estipulada
            perguntasExtraidas = linhas.slice(0, qtd);

            // Salva as configurações permanentemente no LocalStorage do navegador
            const dadosProva = { nome, escola, assunto, tipo, perguntas: perguntasExtraidas };
            localStorage.setItem('configuracaoProva', JSON.stringify(dadosProva));

            alert(`Sucesso! Prova gerada com ${perguntasExtraidas.length} perguntas extraídas do arquivo.`);
            voltarInicio();
        };

        leitor.readAsText(arquivo);
    }

    function solicitarNomeAluno() {
        const provaSalva = localStorage.getItem('configuracaoProva');
        if (!provaSalva) {
            alert("Nenhuma prova foi configurada ou publicada pelo professor ainda.");
            return;
        }
        document.getElementById('tela-inicial').classList.add('hidden');
        document.getElementById('tela-identificacao-aluno').classList.remove('hidden');
    }

    function iniciarProvaAluno() {
        const nomeAluno = document.getElementById('aluno-nome').value.trim();
        if (!nomeAluno) {
            alert("Por favor, digite seu nome antes de iniciar.");
            return;
        }

        const dadosProva = JSON.parse(localStorage.getItem('configuracaoProva'));
        
        document.getElementById('tela-identificacao-aluno').classList.add('hidden');
        document.getElementById('tela-prova').classList.remove('hidden');

        // Renderiza cabeçalhos
        document.getElementById('topo-escola').innerText = dadosProva.escola;
        document.getElementById('topo-assunto').innerText = "Avaliação: " + dadosProva.assunto;
        document.getElementById('topo-prof').innerText = dadosProva.nome;
        document.getElementById('topo-aluno').innerText = nomeAluno;

        // Monta as perguntas na tela
        const container = document.getElementById('container-perguntas');
        container.innerHTML = "";

        dadosProva.perguntas.forEach((pergunta, index) => {
            const numeroQuestao = index + 1;
            const div = document.createElement('div');
            div.className = "questao";

            if (dadosProva.tipo === "objetiva") {
                div.innerHTML = `
                    <p><strong>Questão ${numeroQuestao}:</strong> ${pergunta}</p>
                    <div class="opcoes">
                        <label><input type="radio" name="quest_${numeroQuestao}" value="A"> <strong>A)</strong> Primeira alternativa</label>
                        <label><input type="radio" name="quest_${numeroQuestao}" value="B"> <strong>B)</strong> Segunda alternativa</label>
                        <label><input type="radio" name="quest_${numeroQuestao}" value="C"> <strong>C)</strong> Alternativa correta (Simulada)</label>
                        <label><input type="radio" name="quest_${numeroQuestao}" value="D"> <strong>D)</strong> Quarta alternativa</label>
                        <label><input type="radio" name="quest_${numeroQuestao}" value="E"> <strong>E)</strong> Quinta alternativa</label>
                    </div>
                `;
            } else {
                div.innerHTML = `
                    <p><strong>Questão ${numeroQuestao}:</strong> ${pergunta}</p>
                    <textarea name="quest_${numeroQuestao}" rows="4" placeholder="Escreva sua resposta de forma clara e detalhada..."></textarea>
                `;
            }
            container.appendChild(div);
        });
    }

    function finalizarECorrigir() {
        const dadosProva = JSON.parse(localStorage.getItem('configuracaoProva'));
        const form = document.getElementById('formulario-prova');
        const resultadoDiv = document.getElementById('resultado-conteudo');
        const nomeAluno = document.getElementById('aluno-nome').value;
        
        let nota = 0;
        let totalPerguntas = dadosProva.perguntas.length;

        if (dadosProva.tipo === "objetiva") {
            let respondidas = 0;
            
            for (let i = 1; i <= totalPerguntas; i++) {
                const respostaSelecionada = form.elements[`quest_${i}`].value;
                if (respostaSelecionada) {
                    respondidas++;
                    // Padrão de correção automática simulado: Letra C definida como correta
                    if (respostaSelecionada === "C") {
                        nota += (10 / totalPerguntas);
                    }
                }
            }

            if (respondidas < totalPerguntas) {
                if (!confirm("Você deixou questões sem responder. Tem certeza que deseja entregar?")) return;
            }

            resultadoDiv.innerHTML = `
                <p><strong>Aluno:</strong> ${nomeAluno}</p>
                <p><strong>Status:</strong> Avaliação Corrigida</p>
                <p><strong>Tipo de Prova:</strong> Objetiva (Múltipla Escolha)</p>
                <hr>
                <h3 style="color: #27ae60;">Nota Final: ${nota.toFixed(1)} / 10.0</h3>
                <small style="color: #7f8c8d;">*Nota gerada via correção de gabarito integrado ao sistema.</small>
            `;

        } else {
            // Lógica de avaliação para provas descritivas
            let respondidasDescritivas = 0;

            for (let i = 1; i <= totalPerguntas; i++) {
                const textoResposta = form.elements[`quest_${i}`].value.trim();
                if (textoResposta.length > 10) { 
                    respondidasDescritivas++;
                }
            }

            // Atribui pontuação proporcional ao preenchimento de conteúdo analítico
            nota = (respondidasDescritivas / totalPerguntas) * 10;

            resultadoDiv.innerHTML = `
                <p><strong>Aluno:</strong> ${nomeAluno}</p>
                <p><strong>Status:</strong> Processada pelo Sistema</p>
                <p><strong>Tipo de Prova:</strong> Descritiva (Dissertativa)</p>
                <hr>
                <h3 style="color: #2980b9;">Nota Estimada: ${nota.toFixed(1)} / 10.0</h3>
                <p><small style="color: #7f8c8d;">*Esta nota foi computada baseada nos critérios de extensão e preenchimento dos tópicos solicitados pelo arquivo base.</small></p>
            `;
        }

        // Transiciona para a tela de encerramento
        document.getElementById('tela-prova').classList.add('hidden');
        document.getElementById('tela-resultado').classList.remove('hidden');
    }
</script>

</body>
</html>
