<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Avaliação</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: 20px auto; }
        h2, h3 { text-align: center; color: #222; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .btn-aluno { background-color: #28a745; }
        .btn-aluno:hover { background-color: #218838; }
        .btn-voltar { background-color: #6c757d; }
        .btn-voltar:hover { background-color: #5a6268; }
        .hidden { display: none; }
        .questao { background: #f8f9fa; padding: 15px; margin-bottom: 15px; border-left: 4px solid #007bff; border-radius: 4px; }
        .opcoes label { font-weight: normal; display: block; margin: 8px 0; cursor: pointer; }
        textarea { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; resize: vertical; box-sizing: border-box; }
        .cabecalho { border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="tela-inicial">
        <h2>Painel de Avaliações</h2>
        <button id="btn-prof-inicial" onclick="acessarProfessor()">Painel do Professor</button>
        <button class="btn-aluno" onclick="acessarAluno()">Área do Aluno</button>
    </div>

    <div id="tela-identificacao" class="hidden">
        <h2>Identificação do Aluno</h2>
        <div class="form-group">
            <label>Nome Completo do Aluno:</label>
            <input type="text" id="aluno-nome" placeholder="Ex: João Silva">
        </div>
        <button class="btn-aluno" onclick="iniciarProva()">Iniciar a Prova</button>
        <button class="btn-voltar" onclick="irParaInicio()">Voltar</button>
    </div>

    <div id="panel-professor" class="hidden">
        <h2>Configuração da Prova</h2>
        <div class="form-group">
            <label>Nome do Professor:</label>
            <input type="text" id="prof-nome">
        </div>
        <div class="form-group">
            <label>Escola:</label>
            <input type="text" id="prof-escola">
